<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>সোনার গাঁ</title>
<meta name="description" content="গ্রাম গড়ার সহজ বোর্ড গেম। বন্ধুর সাথে লিংক পাঠিয়ে পালা করে খেলো।">
<meta property="og:title" content="সোনার গাঁ"><meta property="og:description" content="গ্রাম গড়ো, বন্ধুকে হারাও!"><meta property="og:image" content="cover.png"><meta name="theme-color" content="#0b2a38">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">

<style>
:root{--bg:#0b2a38;--bg2:#071a24;--ink:#f4f9fc;--gold:#ffc94d;--panel:#133e52;--panel2:#1a5068;--line:#2a6a86;--good:#35d07f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--ink);overflow:hidden;touch-action:manipulation;font-family:"Noto Sans Bengali","Kalpurush","Bangla Sangam MN","Nirmala UI",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));background:radial-gradient(120% 70% at 50% 0,#14516b 0,var(--bg) 45%,var(--bg2))}
#top{display:flex;gap:6px;align-items:stretch}
#scores{display:flex;gap:6px;flex:1;min-width:0}
.pl{flex:1;min-width:0;background:linear-gradient(var(--panel2),var(--panel));border:2px solid transparent;border-radius:14px;padding:5px 8px 4px;box-shadow:0 3px 0 #0005}
.pl.on{border-color:var(--gold);box-shadow:0 0 14px #ffc94d70,0 3px 0 #0005}
.nm{display:flex;align-items:center;gap:5px;font-size:13px}
.nm i{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #0008;flex:none}
.nm b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{color:var(--gold);font-weight:800;font-size:12px;white-space:nowrap}
.bar{height:6px;border-radius:4px;background:#0006;margin:4px 0 2px;overflow:hidden}
.bar u{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--gold));border-radius:4px;transition:width .5s}
.pl small{font-size:11px;opacity:.85;white-space:nowrap}
.ib{width:40px;border-radius:14px;border:0;background:linear-gradient(var(--panel2),var(--panel));color:var(--ink);font-size:18px;box-shadow:0 3px 0 #0005}
#coach{margin:7px 0 2px;background:#ffc94d1f;border:1.5px solid #ffc94d66;border-radius:12px;padding:6px 10px;font-size:14.5px;line-height:1.35;text-align:center;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:center}
#bw{flex:1;min-height:0;position:relative}
#board{width:100%;height:100%;display:block}
#bd{filter:drop-shadow(0 5px 3px #0008)}
#bw{background:radial-gradient(90% 80% at 50% 45%,#12506b66,transparent 70%)}
#dice{position:absolute;left:0;top:0;background:#000c;border:2px solid var(--gold);border-radius:12px;padding:3px 12px;font-weight:800;font-size:19px;color:var(--gold)}
#toast{position:absolute;left:6px;right:6px;bottom:6px;background:#000d;border:1.5px solid var(--gold);border-radius:12px;padding:8px 10px;text-align:center;font-size:14px;line-height:1.35;animation:up .25s;z-index:3}
#mn{position:absolute;right:0;top:0;background:#000a;border:1.5px solid #ffffff30;border-radius:10px;padding:3px 9px;font-size:12px;color:#cfe8f2;z-index:2}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mp{border:2px solid var(--line);background:#0b2a38;border-radius:14px;padding:6px 2px;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}.mp b{font-size:11.5px}.mp.sel{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 12px #ffc94d40}.rnd{font-size:30px;line-height:50px}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
#hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 0}
.rc{background:linear-gradient(var(--panel2),var(--panel));border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 0;box-shadow:0 3px 0 #0005}
.rc em{font-style:normal;display:flex}.ic{vertical-align:-3px;flex:none}.rc b{font-size:22px}.rc small{font-size:12px;opacity:.8}
#acts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-top:2px}
.ab{border:0;border-radius:14px;background:linear-gradient(var(--panel2),var(--panel));color:var(--ink);font:inherit;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;box-shadow:0 4px 0 #0006;transition:transform .08s}
.ab:active{transform:translateY(3px);box-shadow:0 1px 0 #0006}
.ab small{font-size:11px;font-weight:400;opacity:.9}
.ab.dim{opacity:.4}
.ab.go{background:linear-gradient(#45e08f,#1fa863);animation:glow 1s infinite alternate}
.ab.sel{outline:3px solid var(--gold)}
@keyframes glow{to{box-shadow:0 4px 0 #0006,0 0 16px #5affa5aa}}
#prim{grid-column:1/-1;background:linear-gradient(#ffd97a,#f0a928);color:#3a2300;font-size:19px;min-height:52px}
#prim.go{background:linear-gradient(#45e08f,#1fa863);color:#032}
#prim.pulse{animation:glow 1s infinite alternate,beat 1s infinite alternate}
@keyframes beat{to{transform:scale(1.03)}}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#card{background:linear-gradient(#17536b,#0e3445);border:2px solid var(--gold);border-radius:22px;padding:20px;max-width:400px;width:100%;max-height:94%;overflow:auto;text-align:center;box-shadow:0 10px 40px #000a}
h1{font-size:46px;color:var(--gold);margin:2px 0;line-height:1.2}
h2{margin:0 0 8px;color:var(--gold);font-size:24px}
p{line-height:1.55;font-size:16px;margin:8px 0}
.sub{opacity:.95}.lb{font-size:13.5px;opacity:.85}
.big{display:block;width:100%;border:0;border-radius:16px;background:linear-gradient(#ffd97a,#f0a928);color:#3a2300;font:inherit;font-weight:800;font-size:18px;padding:13px;margin:10px 0 4px;box-shadow:0 4px 0 #7a4e00}
.big.alt{background:linear-gradient(#5fd0f0,#2a8fb5);color:#04202c;box-shadow:0 4px 0 #0b4a63}
.ghost{display:block;width:100%;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;border-radius:14px;padding:10px;margin-top:8px;font-size:15px}
.row{display:flex;gap:8px;margin:8px 0}
.chip{flex:1;border:2px solid var(--line);background:#0b2a38;color:var(--ink);border-radius:14px;padding:8px 0;font:inherit;font-size:26px}
.chip small{display:block;font-size:12px}
.chip.sel{border-color:var(--gold);background:var(--panel2)}.chip.off{opacity:.3}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}.dots i{width:8px;height:8px;border-radius:50%;background:#fff4}.dots i.on{background:var(--gold)}
.hl{fill:#ffd45a;stroke:#fff;stroke-width:2;animation:pl .8s infinite alternate}
.el{fill:none;stroke:#ffd45a;stroke-width:8;stroke-linecap:round;animation:pl .8s infinite alternate}
.hot{fill:#fff3;stroke:#fff;stroke-width:3.5;stroke-linejoin:round;animation:pl .8s infinite alternate;pointer-events:none}
@keyframes pl{to{opacity:.4}}
.fl{animation:fl 1.4s ease-out forwards;pointer-events:none}.fl text{font-size:16px;font-weight:800;stroke:#000;stroke-width:3px;paint-order:stroke}
@keyframes fl{to{transform:translateY(-30px);opacity:0}}
#conf{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
#conf span{position:absolute;top:-30px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-height:620px){#coach{min-height:38px;font-size:13px}.ab{min-height:46px}#prim{min-height:44px}}
input{width:100%;margin-top:8px;padding:10px;border-radius:12px;border:2px solid var(--line);background:#0b2a38;color:var(--ink);font:inherit;font-size:14px;text-align:center;-webkit-user-select:text;user-select:text}
#acts{display:flex!important;flex-wrap:wrap;align-content:flex-end;min-height:116px}
.ab{flex:1 1 0;min-width:0}#prim{flex:1 1 100%}
#nobuy{flex:1 1 100%;text-align:center;font-size:13.5px;opacity:.9;padding:6px;border:1.5px dashed var(--line);border-radius:12px}
#fly{position:fixed;inset:0;pointer-events:none;z-index:8}
.fly{position:absolute;display:flex;align-items:center;gap:2px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px #000b)}.fly b{font-size:15px;color:#fff;text-shadow:0 1px 3px #000}
.rc{position:relative}.rc.bump{animation:bump .55s}@keyframes bump{40%{transform:scale(1.16);background:#2f7a52}}
.plus{position:absolute;top:-8px;right:10px;font-style:normal;font-weight:800;font-size:16px;color:#7dffb0;text-shadow:0 1px 3px #000;animation:plus .9s forwards}@keyframes plus{to{transform:translateY(-16px);opacity:0}}
.stage{background:radial-gradient(#0f3a4d,#08202c);border:2px solid var(--line);border-radius:16px;padding:6px}
.cap{font-size:17px;font-weight:700;min-height:50px;margin:8px 0 2px;line-height:1.4}
.tt{font-size:11px;font-weight:800;fill:#1c2b36;text-anchor:middle;dominant-baseline:central}
.tb{font-size:22px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central}
.ts{font-size:22px;font-weight:800;fill:#ffc94d;text-anchor:middle}
.td{text-anchor:middle;dominant-baseline:central;font-size:30px;font-weight:800;fill:#1c2b36}
.t-die{transform-box:fill-box;transform-origin:center;animation:tdie 6s infinite}
@keyframes tdie{0%{transform:rotate(0)}5%{transform:rotate(30deg)}10%{transform:rotate(-30deg)}15%{transform:rotate(30deg)}20%{transform:rotate(-30deg)}25%,100%{transform:rotate(0)}}
.t-die .d1,.t-die .d2,.t-die .d3,.t-die .d4{opacity:0}
.d1{animation:td1 6s infinite}.d2{animation:td2 6s infinite}.d3{animation:td3 6s infinite}.d4{animation:td4 6s infinite}
@keyframes td1{0%,5%{opacity:1}5.1%,100%{opacity:0}}@keyframes td2{0%,5%{opacity:0}5.1%,10%{opacity:1}10.1%,100%{opacity:0}}
@keyframes td3{0%,10%{opacity:0}10.1%,15%{opacity:1}15.1%,100%{opacity:0}}@keyframes td4{0%,15%{opacity:0}20%,95%{opacity:1}100%{opacity:0}}
.t-glow{opacity:0;animation:tglow 6s infinite}@keyframes tglow{0%,28%{opacity:0}35%{opacity:1}50%{opacity:.3}65%,100%{opacity:1}}
.t-glow2{animation:tglow2 6s infinite}@keyframes tglow2{0%,30%{opacity:1}45%{opacity:.3}60%,100%{opacity:1}}
.t-fly{opacity:0;animation:tfly 6s infinite}@keyframes tfly{0%,20%{opacity:0;transform:translate(0,0) scale(1.2)}25%{opacity:1}70%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1)}76%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
.t-flyb{opacity:0;animation:tflyb 6s infinite}@keyframes tflyb{0%,6%{opacity:0;transform:translate(0,0) scale(1)}10%{opacity:1}50%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(.8)}54%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.8)}}
.t-a1{animation:tha1 6s infinite}.t-b1{opacity:0;animation:thb1 6s infinite}.t-a2{animation:tha2 6s infinite}.t-b2{opacity:0;animation:thb2 6s infinite}
@keyframes tha1{0%,55%{opacity:1}55.1%,100%{opacity:0}}@keyframes thb1{0%,55%{opacity:0}55.1%,100%{opacity:1}}
@keyframes tha2{0%,76%{opacity:1}76.1%,100%{opacity:0}}@keyframes thb2{0%,76%{opacity:0}76.1%,100%{opacity:1}}
.t-plus{opacity:0;fill:#7dffb0;font-size:18px;font-weight:800;text-anchor:middle;animation:tplus 6s infinite}@keyframes tplus{0%,76%{opacity:0;transform:translateY(0)}80%{opacity:1}94%,100%{opacity:0;transform:translateY(-16px)}}
.t-pop{opacity:0;animation:tpop 6s infinite}@keyframes tpop{0%,55%{opacity:0;transform:scale(0)}62%{opacity:1;transform:scale(1.5)}70%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
.t-hutout{animation:thout 6s infinite}@keyframes thout{0%,55%{opacity:1}57%,100%{opacity:0}}
.t-bar{transform-box:fill-box;transform-origin:left;animation:tbar 6s infinite}@keyframes tbar{0%{transform:scaleX(.05)}65%,100%{transform:scaleX(1)}}
.tc1,.tc2,.tc3,.tc4,.tc5{opacity:0}.tc1{animation:tc1 6s infinite}.tc2{animation:tc2 6s infinite}.tc3{animation:tc3 6s infinite}.tc4{animation:tc4 6s infinite}.tc5{animation:tc5 6s infinite}
@keyframes tc1{0%,13%{opacity:1}13.1%,100%{opacity:0}}@keyframes tc2{0%,13%{opacity:0}13.1%,26%{opacity:1}26.1%,100%{opacity:0}}@keyframes tc3{0%,26%{opacity:0}26.1%,39%{opacity:1}39.1%,100%{opacity:0}}@keyframes tc4{0%,39%{opacity:0}39.1%,52%{opacity:1}52.1%,100%{opacity:0}}@keyframes tc5{0%,52%{opacity:0}52.1%,95%{opacity:1}100%{opacity:0}}
.t-trophy{opacity:0;font-size:48px;text-anchor:middle;transform-box:fill-box;transform-origin:center;animation:ttro 6s infinite}@keyframes ttro{0%,60%{opacity:0;transform:scale(0)}68%{opacity:1;transform:scale(1.35)}76%,94%{opacity:1;transform:scale(1)}100%{opacity:0}}
.t-cf{opacity:0;font-size:22px;animation:tcf 6s infinite}@keyframes tcf{0%,62%{opacity:0;transform:translateY(0)}66%{opacity:1}100%{opacity:0;transform:translateY(190px)}}
.best{fill:none;stroke:#7dffb0;stroke-width:3.5;animation:pl .7s infinite alternate}.bt{font-size:10px;font-weight:800;fill:#7dffb0;stroke:#000;stroke-width:2.5px;paint-order:stroke;text-anchor:middle;pointer-events:none}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div id="scores"></div><button class="ib" id="bm" aria-label="মেনু">☰</button></div>
 <div id="coach"></div>
 <div id="bw">
  <svg id="board" viewBox="-190 -172 380 344">
   <defs id="dfs">
    <radialGradient id="g0" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#d9981a"/></radialGradient>
    <radialGradient id="g1" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#8be3f7"/><stop offset="1" stop-color="#2386ac"/></radialGradient>
    <radialGradient id="g2" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#b3f08c"/><stop offset="1" stop-color="#37923a"/></radialGradient>
    <radialGradient id="gp" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#a9d0df"/><stop offset="1" stop-color="#4d8399"/></radialGradient>
    <radialGradient id="tk" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fffdf2"/><stop offset="1" stop-color="#ecd9a6"/></radialGradient>
    <symbol id="r0" viewBox="0 0 32 32"><path d="M16 30V10" stroke="#6b4a08" stroke-width="2.2" fill="none" stroke-linecap="round"/><g fill="#fff6c4" stroke="#6b4a08" stroke-width="1.2"><ellipse cx="16" cy="5" rx="2.6" ry="4"/><ellipse cx="11" cy="10" rx="2.4" ry="3.8" transform="rotate(-35 11 10)"/><ellipse cx="21" cy="10" rx="2.4" ry="3.8" transform="rotate(35 21 10)"/><ellipse cx="10.5" cy="17" rx="2.4" ry="3.8" transform="rotate(-35 10.5 17)"/><ellipse cx="21.5" cy="17" rx="2.4" ry="3.8" transform="rotate(35 21.5 17)"/></g></symbol>
    <symbol id="r1" viewBox="0 0 32 32"><path d="M3 16c5-8 14-9 20-3l6-5v16l-6-5c-6 6-15 5-20-3z" fill="#fff" stroke="#0b4a63" stroke-width="1.7" stroke-linejoin="round"/><circle cx="9" cy="14" r="1.7" fill="#0b4a63"/><path d="M15 11c2 3 2 7 0 10" stroke="#8fcfe6" fill="none" stroke-width="1.7" stroke-linecap="round"/></symbol>

 </div>

<script>
var NOFR=false;
/*ENGINE*/
const SIDES=4,WIN=8,SETUP=[0,1,1,0],EASY_SKIP=.8;
const COST={p:[0,1,1],h:[1,1,1],c:[2,2,0]};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const enc=(t,i)=>t+i.toString(36).padStart(2,'0');
function rng(a){a>>>=0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dice=(seed,tn)=>Math.floor(rng(Math.imul(seed,2654435761)+Math.imul(tn+1,40503))()*SIDES)+1;
const _ring=(f)=>{const a=[];for(let r=-2;r<=2;r++)for(let q=-2;q<=2;q++)if(Math.abs(q+r)<=2)a.push([q,r,f(q,r)]);return a};
const _long=()=>{const a=[];for(let r=0;r<=3;r++)for(let q=-(r>>1);q<=-(r>>1)+4;q++)a.push([q,r,(q==2&&r==1)||(q==1&&r==2)]);return a};
const _tri=()=>{const a=[];for(let r=0;r<=4;r++)for(let q=0;q<=4-r;q++)a.push([q,r,q==1&&r==1]);return a};
const MAPS=[{n:'সোনালি মাঠ',cells:_ring((q,r)=>!q&&!r)},{n:'নদীর পাড়',cells:_ring((q,r)=>q==0&&Math.abs(r)<=1)},{n:'হাওরের বুক',cells:_long()},{n:'ত্রিমোহনা',cells:_tri()}];
function mk(seed,names,ids){
 const map=MAPS[seed%MAPS.length],rn=rng(seed),sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rn()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const L=map.cells.filter(c=>!c[2]).length,res=sh(Array.from({length:L},(_,i)=>i%3)),nums=sh(Array.from({length:L},(_,i)=>i%SIDES+1));
 const S=40,SQ=Math.sqrt(3),h=[],V=[],E=[],vm={},em={};let n=0;
 map.cells.forEach(([q,r,pd])=>{h.push({q,r,x:S*SQ*(q+r/2),y:S*1.5*r,res:pd?-1:res[n],num:pd?0:nums[n],v:[]});if(!pd)n++});
 h.forEach((H,hi)=>{
  for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30),x=H.x+S*Math.cos(a),y=H.y+S*Math.sin(a),key=Math.round(x)+','+Math.round(y);
   if(vm[key]==null){vm[key]=V.length;V.push({x,y,hx:[],ed:[],nb:[],o:-1,t:0})}H.v.push(vm[key]);V[vm[key]].hx.push(hi)}
  for(let k=0;k<6;k++){const a=H.v[k],b=H.v[(k+1)%6],key=Math.min(a,b)+'|'+Math.max(a,b);
   if(em[key]==null){em[key]=E.length;E.push({a,b,o:-1});V[a].ed.push(E.length-1);V[b].ed.push(E.length-1);V[a].nb.push(b);V[b].nb.push(a)}}});

 const glow=`<g class="t-glow"><polygon points="${hx(80,70,34)}" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g>`;
 const ox=`style="transform-origin:${VX}px ${VY}px"`;
 const scenes=[
  `${base}${hut()}${glow}${die(1)}${star('২')}${bank(['০','০','০'])}`,
  `${base}${hut()}<g class="t-glow2"><polygon points="${hx(80,70,34)}" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g>${die(0)}${star('২')}${bank(['০','০','০'],['১',null,null],2)}${fly(0,68,44,26,189,'',0)}<text class="t-plus" x="60" y="170">+১</text>`,
  `${base}${star('২','৩')}${bank(['১','১','১'],['০','০','০'],1)}<g class="t-pop" ${ox}>${hut()}</g>${fly(0,26,189,97.5,75,'b',0)}${fly(1,126,189,97.5,75,'b',.25)}${fly(2,226,189,97.5,75,'b',.5)}`,
  `${base}<g class="t-hutout">${hut()}</g><g class="t-pop" ${ox}>${city()}</g>${star('৩','৪')}${bank(['২','২','০'],['০','০',null],1)}${fly(0,26,189,97.5,75,'b',0)}${fly(0,26,189,97.5,75,'b',.3)}${fly(1,126,189,97.5,75,'b',.15)}${fly(1,126,189,97.5,75,'b',.45)}`,
  `<rect x="30" y="100" width="260" height="30" rx="15" fill="#0b2a38" stroke="#2a6a86" stroke-width="2"/><rect class="t-bar" x="30" y="100" width="260" height="30" rx="15" fill="#ffc94d"/>${['০','২','৪','৬','৮'].map((n,i)=>`<text x="160" y="190" class="tb tc${i+1}">${n} পয়েন্ট</text>`).join('')}<text x="160" y="72" class="t-trophy">🏆</text>${['🎉','⭐','🌾','🐟','✨','🎋'].map((e,i)=>`<text x="${40+i*48}" y="20" class="t-cf" style="animation-delay:${i*.18}s">${e}</text>`).join('')}`];
 const caps=['🎲 পাশা ফেলো। যে জমির সংখ্যা মিলবে, সে সম্পদ দেবে','সম্পদ উড়ে এসে জমা হয় তোমার ব্যাংকে','সম্পদ দিয়ে কুঁড়ে বানাও: ১ পয়েন্ট','কুঁড়ে বদলে দালান: আরও ১ পয়েন্ট','আগে '+bn(WIN)+' পয়েন্ট পেলে জয়! 🏆'];
 let i=0,tm=0;const id=Date.now();
 const done=()=>{clearTimeout(tm);delete card.dataset.tut;hide();if(!thenStart&&!G)showHome()};
 const draw=()=>{clearTimeout(tm);modal(`<div class="stage"><svg viewBox="0 0 320 240" width="100%">${scenes[i]}</svg></div><p class="cap">${caps[i]}</p><div class="dots">${scenes.map((_,j)=>`<i${j==i?' class="on"':''}></i>`).join('')}</div><div class="row"><button class="ghost" id="pv" style="width:56px;margin:8px 0 0"${i?'':' disabled'}>◀</button><button class="big" id="nx" style="margin:8px 0 0">${i<scenes.length-1?'পরের ➜':'খেলা শুরু ▶'}</button></div><button class="ghost" id="sk">বাদ দাও</button>`);
  card.dataset.tut=id;$('pv').onclick=()=>{if(i){i--;draw()}};$('nx').onclick=()=>{if(i<scenes.length-1){i++;draw()}else done()};$('sk').onclick=done;
  tm=setTimeout(()=>{if(card.dataset.tut==id&&!$('modal').hidden&&i<scenes.length-1){i++;draw()}},6500)};
 draw()}
function showHome(){
 const nt=nextT(D.w),cr=D.cur&&(D.cur.m!='fb'||D.cur.c==ctxId)?D.cur:null;
 modal(`<h1>সোনার গাঁ</h1><p class="sub">গ্রাম গড়ো, ধান-মাছ-বাঁশ জমাও</p><input id="nmi" maxlength="10" placeholder="তোমার নাম লেখো" value="${(D.name||myName||'').replace(/"/g,'')}"><p class="lb">${titleOf(D.w)} · ${bn(D.w)}টি জয} · টানা 🔥${bn(D.s)}${nt?`<br>পরের পদ "${nt[1]}" থেকে ${bn(nt[0]-D.w)}টি জয় দূরে`:''}</p>${cr?'<button class="big alt" id="rs">▶ আগের খেলা চালিয়ে যাও</button>':''}<p class="lb" style="margin:10px 0 4px">মানচিত্র বাছো</p><div class="maps">${MAPS.map((m,i)=>`<button class="mp${mapSel==i?' sel':''}" data-m="${i}">${miniMap(i)}<b>${m.n}</b></button>`).join('')}<button class="mp${mapSel<0?' sel':''}" data-m="-1"><span class="rnd">🎲</span><b>যেকোনো</b></button></div>${NOFR?'':`<button class="big" id="fr">${fbOK?'💬 মেসেঞ্জারে বন্ধুর সাথে খেলো':'🔗 লিংক পাঠিয়ে বন্ধুর সাথে খেলো'}</button>`}<button class="big alt" id="bt">🤖 কম্পিউটারের সাথে খেলো</button><div class="row" id="lv"><button class="chip${level==0?' sel':''}" data-l="0">😊 সহজ</button><button class="chip${level==1?' sel':''}" data-l="1">😎 মাঝারি</button></div><button class="ghost" id="lc">👥 একই ফোনে দুজন</button><button class="ghost" id="rl">▶ কীভাবে খেলবে (ছোট ভিডিও)</button>`.replace('জয}','জয়'));
 if($('rs'))$('rs').onclick=()=>resume(D.cur);if($('fr'))$('fr').onclick=startFriend;
 $('nmi').oninput=()=>{myName=clean($('nmi').value);D.name=myName;store.save()};$('bt').onclick=()=>start('bot');$('lc').onclick=()=>start('local');$('rl').onclick=()=>showRules(false);
 $('card').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mapSel=+b.dataset.m;D.map=mapSel;store.save();showHome()});
 $('card').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=+b.dataset.l;D.lvl=level;store.save();showHome()})}
function menu(){modal(`<h2>মেনু</h2><button class="ghost" id="m1">▶ কীভাবে খেলবে</button><button class="ghost" id="m2">${snd?'🔊 শব্দ চালু':'🔇 শব্দ বন্ধ'}</button><button class="ghost" id="m3">🏠 মূল মেনু</button>${fbOK&&gmode=='fb'?'<button class="ghost" id="m4">💬 চ্যাটে ফিরে যাও</button>':''}<button class="big" id="m0">খেলায় ফিরো</button>`);
 $('m0').onclick=hide;$('m1').onclick=()=>showRules(true);$('m2').onclick=()=>{snd=!snd;menu()};$('m3').onclick=showHome;if($('m4'))$('m4').onclick=()=>{try{FBInstant.quit()}catch(e){}}}
/* ---------- boot ---------- */
$('bpath').onclick=()=>bld('path');$('bhut').onclick=()=>bld('hut');$('bcity').onclick=()=>bld('city');
$('btrade').onclick=openTrade;$('prim').onclick=onPrimary;$('bm').onclick=menu;
(async()=>{
 const entry=(await fbInit())||hashEntry();D=Object.assign(D,await store.load());
 if(D.name)myName=clean(D.name);if(typeof D.map=='number')mapSel=D.map;if(D.lv2!==1){D.lv2=1;D.lvl=0;store.save()}level=typeof D.lvl=='number'?D.lvl:0;
 [['bpath',COST.p],['bhut',COST.h],['bcity',COST.c]].forEach(([id,c])=>$(id).querySelector('small').innerHTML=ems(c,15));
 if(!fbOK){if(!D.uid){D.uid=Math.random().toString(36).slice(2,10);store.save()}myId=D.uid}
 if(entry&&entry.s){loadFb(entry)}else showHome()})();

</script>
</body>
